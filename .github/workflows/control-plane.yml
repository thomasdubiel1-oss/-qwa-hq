name: control-plane
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: |
          python -m unittest discover -s control-plane -p 'test_*.py'
          python -m unittest discover -s services -p 'test_*.py'
