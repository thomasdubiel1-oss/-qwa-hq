mcp_servers:
  qwa-github:
    url: "https://mcp.qwa.internal/github"
    tools:
      include: [repo_inspect, branch_create, pr_create, pr_read, ci_status]
  qwa-staging:
    url: "https://mcp.qwa.internal/staging"
    tools:
      include: [deploy_staging, deployment_status, logs]
  qwa-knowledge:
    url: "https://mcp.qwa.internal/knowledge"
    tools:
      include: [search, read, write_decision, write_runbook]
  qwa-production:
    url: "https://mcp.qwa.internal/production"
    tools:
      include: [request_change, approval_status]
